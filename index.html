<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Ultimate Question Generator</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script id="MathJax-script" async src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      padding: 26px 22px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { text-align: center; font-size: 24px; color: #0f172a; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      font-weight: 600; font-size: 14px; cursor: pointer;
      background: #f1f5f9; color: #475569; transition: 0.2s;
    }
    .tab-btn.active.phy { background: #2563eb; color: white; }
    .tab-btn.active.chem { background: #9333ea; color: white; }
    .tab-btn.active.math { background: #ea580c; color: white; }
    .controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    select {
      flex: 1; min-width: 130px; padding: 10px; border-radius: 10px;
      border: 2px solid #e2e8f0; font-family: inherit; font-size: 13px; font-weight: 500;
    }
    .status-bar {
      display: flex; justify-content: space-between; background: #f8fafc;
      border: 1px solid #e2e8f0; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; margin-bottom: 16px;
    }
    .question-text { font-size: 15.5px; line-height: 1.65; margin-bottom: 16px; font-weight: 500; color: #0f172a; }
    .option {
      display: block; width: 100%; margin: 8px 0; padding: 12px 16px;
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
      text-align: left; font-size: 14.5px; font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    .option:hover { background: #eff6ff; border-color: #3b82f6; }
    #result { font-weight: 700; font-size: 14.5px; margin-top: 12px; text-align: center; }
    #solution-box {
      display: none; background: #f0fdf4; border-left: 4px solid #16a34a;
      padding: 14px; margin-top: 14px; border-radius: 8px; font-size: 13.5px;
      line-height: 1.6; color: #14532d;
    }
    .next-btn {
      width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #4f46e5); color: white;
      font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
    }
    .next-btn:hover { opacity: 0.95; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JEE Question Generator</h1>
    <p class="subtitle">Physics • Chemistry • Mathematics (Class 11 & 12)</p>

    <!-- Subject Tabs -->
    <div class="tabs">
      <button class="tab-btn active phy" onclick="setSubject('phy', this)">⚡ Physics</button>
      <button class="tab-btn chem" onclick="setSubject('chem', this)">🧪 Chemistry</button>
      <button class="tab-btn math" onclick="setSubject('math', this)">📐 Maths</button>
    </div>

    <!-- Class & Chapter Dropdowns -->
    <div class="controls">
      <select id="classSelect" onchange="updateChapters()">
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>
      <select id="chapterSelect" onchange="resetQuiz()"></select>
    </div>

    <!-- Live Status Bar -->
    <div class="status-bar">
      <span id="qNumber">Q. 1</span>
      <span id="scoreDisplay">Score: 0/0</span>
      <span id="timer">Time: 00:00</span>
    </div>

    <!-- Question Area -->
    <div id="question" class="question-text"></div>
    <div id="options"></div>
    <div id="result"></div>

    <!-- Solution Area -->
    <div id="solution-box">
      <strong>Step-by-Step Solution:</strong>
      <div id="solution-text" style="margin-top: 6px;"></div>
    </div>

    <button class="next-btn" onclick="nextQuestion()">Next Question →</button>
  </div>

  <script>
    let currentSub = "phy";
    let qCount = 0, correctCount = 0, attemptedCount = 0;
    let seconds = 0, timerInterval, currentAns = "", answered = false;

    const syllabus = {
      phy: {
        "11": [
          { id: "kinematics", name: "Kinematics" },
          { id: "nlm", name: "Laws of Motion" },
          { id: "wep", name: "Work, Energy & Power" },
          { id: "gravitation", name: "Gravitation" }
        ],
        "12": [
          { id: "electrostatics", name: "Electrostatics" },
          { id: "current", name: "Current Electricity" },
          { id: "magnetism", name: "Magnetism" },
          { id: "optics", name: "Ray Optics" }
        ]
      },
      chem: {
        "11": [
          { id: "mole", name: "Mole Concept" },
          { id: "atomic", name: "Atomic Structure" },
          { id: "thermo", name: "Thermodynamics" },
          { id: "ph", name: "Ionic Equilibrium (pH)" }
        ],
        "12": [
          { id: "solutions", name: "Solutions" },
          { id: "electrochem", name: "Electrochemistry" },
          { id: "kinetics", name: "Chemical Kinetics" },
          { id: "coord", name: "Coordination Compounds" }
        ]
      },
      math: {
        "11": [
          { id: "quadratic", name: "Quadratic Equations" },
          { id: "ap", name: "Sequence & Series" },
          { id: "pnc", name: "Permutations & Combinations" },
          { id: "limits", name: "Limits & Derivatives" }
        ],
        "12": [
          { id: "matrices", name: "Matrices & Determinants" },
          { id: "integration", name: "Definite Integration" },
          { id: "vectors", name: "Vector Algebra" },
          { id: "prob", name: "Probability" }
        ]
      }
    };

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function setSubject(sub, btn) {
      currentSub = sub;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateChapters();
    }

    function updateChapters() {
      const cls = document.getElementById("classSelect").value;
      const chapSelect = document.getElementById("chapterSelect");
      chapSelect.innerHTML = "";
      syllabus[currentSub][cls].forEach(ch => {
        let opt = document.createElement("option");
        opt.value = ch.id;
        opt.innerText = ch.name;
        chapSelect.appendChild(opt);
      });
      resetQuiz();
    }

    function startTimer() {
      clearInterval(timerInterval);
      seconds = 0;
      document.getElementById("timer").innerText = "Time: 00:00";
      timerInterval = setInterval(() => {
        seconds++;
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `Time: ${m}:${s}`;
      }, 1000);
    }

    function resetQuiz() {
      qCount = 0;
      nextQuestion();
    }

    function nextQuestion() {
      qCount++;
      answered = false;
      document.getElementById("qNumber").innerText = `Q. ${qCount}`;
      document.getElementById("result").innerText = "";
      document.getElementById("solution-box").style.display = "none";
      startTimer();

      const ch = document.getElementById("chapterSelect").value;
      const data = generateQuestion(ch);

      document.getElementById("question").innerHTML = data.q;
      document.getElementById("solution-text").innerHTML = data.sol;
      currentAns = data.ans;

      let shuffled = [...data.opts].sort(() => Math.random() - 0.5);
      let html = "";
      shuffled.forEach(opt => {
        html += `<button class="option" onclick="checkAns('${opt}')">${opt}</button>`;
      });
      document.getElementById("options").innerHTML = html;

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function generateQuestion(ch) {
      // PHYSICS
      if (ch === "kinematics") {
        let u = rand(2, 6) * 10, h = (u * u) / 20;
        return { q: `Ek ball ko vertically upward \\( u = ${u}\\text{ m/s} \\) se phenka gaya. Maximum height kya hogi? (\\( g = 10\\text{ m/s}^2 \\))`, ans: `${h} m`, opts: [`${h} m`, `${h*2} m`, `${h+15} m`, `${Math.abs(h-10)} m`], sol: `\\( H = \\frac{u^2}{2g} = \\frac{${u}^2}{20} = ${h}\\text{ m} \\)` };
      }
      if (ch === "nlm") {
        let m = rand(2, 8), a = rand(2, 5), f = rand(35, 65), fk = f - m * a;
        return { q: `Ek \\( ${m}\\text{ kg} \\) block par \\( ${f}\\text{ N} \\) force lagane par acceleration \\( ${a}\\text{ m/s}^2 \\) hai. Friction force kya hoga?`, ans: `${fk} N`, opts: [`${fk} N`, `${m*a} N`, `${f+m*a} N`, `${fk+5} N`], sol: `\\( f_k = F - ma = ${f} - (${m} \\times ${a}) = ${fk}\\text{ N} \\)` };
      }
      if (ch === "wep") {
        let m = rand(2, 6), v1 = rand(2, 4), v2 = v1 + rand(2, 5), w = 0.5 * m * (v2 * v2 - v1 * v1);
        return { q: `Ek \\( ${m}\\text{ kg} \\) body ki speed \\( ${v1}\\text{ m/s} \\) se \\( ${v2}\\text{ m/s} \\) ho jati hai. Net work done kitna hoga?`, ans: `${w} J`, opts: [`${w} J`, `${w+15} J`, `${0.5*m*v2*v2} J`, `${Math.abs(w-10)} J`], sol: `\\( W = \\frac{1}{2}m(v_2^2 - v_1^2) = ${w}\\text{ J} \\)` };
      }
      if (ch === "gravitation") {
        let n = rand(1, 3), gNew = (10 / Math.pow(1 + n, 2)).toFixed(2);
