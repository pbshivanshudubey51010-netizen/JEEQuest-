
<!DOCTYPE html>

<body>

  <script>

    const builtInDB = {
      sets: () => {
        let n = rand(3, 5), sub = Math.pow(2, n);
        return { q: `Agar set \\( A \\) mein \\( ${n} \\) elements hain, toh set \\( A \\) ke total proper subsets kitne honge?`, ans: `${sub - 1}`, opts: [`${sub - 1}`, `${sub}`, `${n * 2}`, `${sub - 2}`], sol: `Total subsets \\( = 2^n = 2^{${n}} = ${sub} \\). Proper subsets \\( = 2^n - 1 = ${sub - 1} \\)` };
      },
      quadratic: () => {
        let r1 = rand(2, 6), r2 = rand(3, 8), b = -(r1 + r2), c = r1 * r2, ansVal = r1 * r1 + r2 * r2;
        return { q: `Agar \\( \\alpha, \\beta \\) equation \\( x^2 ${b}x + ${c} = 0 \\) ke roots hain, toh \\( \\alpha^2 + \\beta^2 \\) kya hoga?`, ans: `${ansVal}`, opts: [`${ansVal}`, `${(r1+r2)*(r1+r2)}`, `${ansVal + 2*c}`, `${Math.abs(ansVal-8)}`], sol: `\\( \\alpha^2 + \\beta^2 = (\\alpha + \\beta)^2 - 2\\alpha\\beta = (${r1+r2})^2 - 2(${c}) = ${ansVal} \\)` };
      },
      sequence: () => {
        let a = rand(2, 8), d = rand(2, 6), n = rand(8, 15), nth = a + (n - 1) * d;

      },
      pnc: () => {
        let n = rand(5, 8), r = rand(2, 3);
        let f = (x) => (x <= 1 ? 1 : x * f(x - 1));
        let nCr = f(n) / (f(r) * f(n - r));
        return { q: `\\( ^{${n}}C_{${r}} \\) ki value kya hogi?`, ans: `${nCr}`, opts: [`${nCr}`, `${nCr * f(r)}`, `${nCr + 5}`, `${n * r}`], sol: `\\( ^{${n}}C_{${r}} = \\frac{${n}!}{${r}!${n-r}!} = ${nCr} \\)` };
      },
      trigo: () => {
        return { q: `\\( \\sin(75^\\circ) \\) ki exact value kya hoti hai?`, ans: "(√3 + 1) / 2√2", opts: ["(√3 + 1) / 2√2", "(√3 - 1) / 2√2", "(√3 + 1) / √2", "√3 / 2"], sol: `\\( \\sin(45^\\circ + 30^\\circ) = \\sin 45^\\circ \\cos 30^\\circ + \\cos 45^\\circ \\sin 30^\\circ = \\frac{\\sqrt{3} + 1}{2\\sqrt{2}} \\)` };
      },
      conics: () => {
        let a = rand(2, 5);
        return { q: `Parabola \\( y^2 = ${4 * a}x \\) ke focus ke coordinates kya honge?`, ans: `(${a}, 0)`, opts: [`(${a}, 0)`, `(0, ${a})`, `(-${a}, 0)`, `(${4*a}, 0)`], sol: `Comparing with \\( y^2 = 4ax \\implies 4a = ${4*a} \\implies a = ${a} \\). Focus = \\( (${a}, 0) \\)` };
      },
      limits: () => {
        let a = rand(2, 7), val = 2 * a;
        return { q: `\\( \\lim_{x \\to ${a}} \\frac{x^2 - ${a*a}}{x - ${a}} \\) ki value kya hogi?`, ans: `${val}`, opts: [`${val}`, `${a*a}`, `${a}`, `0`], sol: `\\( \\lim_{x \\to ${a}} (x + ${a}) = ${a} + ${a} = ${val} \\)` };
      },
      matrices: () => {
        let a = rand(2, 6), b = rand(1, 5), c = rand(1, 4), d = rand(3, 8), det = a * d - b * c;
        return { q: `Matrix \\( \\begin{bmatrix} ${a} & ${b} \\\\ ${c} & ${d} \\end{bmatrix} \\) ka determinant kya hoga?`, ans: `${det}`, opts: [`${det}`, `${a*d + b*c}`, `${-det}`, `${det + 4}`], sol: `\\( (${a})(${d}) - (${b})(${c}) = ${det} \\)` };
      },
      calculus_diff: () => {
        let k = rand(2, 6), x = rand(1, 4), slope = 2 * k * x;
        return { q: `Curve \\( y = ${k}x^2 + 5 \\) par point \\( x = ${x} \\) par tangent ka slope kya hoga?`, ans: `${slope}`, opts: [`${slope}`, `${k*x*x}`, `${k*x}`, `${slope + 4}`], sol: `\\( \\frac{dy}{dx} = ${2*k}x \\implies \\text{At } x = ${x}, \\text{ slope} = ${slope} \\)` };
      },
      integration: () => {
        let k = rand(2, 6), u = rand(2, 4), ansInt = (k * u * u) / 2;
        return { q: `\\( \\int_{0}^{${u}} ${k}x \\, dx \\) ki value kya hogi?`, ans: `${ansInt}`, opts: [`${ansInt}`, `${k*u}`, `${ansInt*2}`, `${ansInt+3}`], sol: `\\( \\left[\\frac{${k}x^2}{2}\\right]_0^{${u}} = ${ansInt} \\)` };
      },
      vectors: () => {
        let x1 = rand(1, 4), y1 = rand(2, 5), x2 = rand(2, 5), y2 = rand(1, 4), dot = x1 * x2 + y1 * y2;
        return { q: `\\( \\vec{a} = ${x1}\\hat{i} + ${y1}\\hat{j} \\) aur \\( \\vec{b} = ${x2}\\hat{i} + ${y2}\\hat{j} \\) ka dot product kya hoga?`, ans: `${dot}`, opts: [`${dot}`, `${x1*y2 - y1*x2}`, `${dot+5}`, `${x1+x2+y1+y2}`], sol: `\\( \\vec{a}\\cdot\\vec{b} = (${x1})(${x2}) + (${y1})(${y2}) = ${dot} \\)` };
      },
      probability: () => {
        let r = rand(3, 6), b = rand(4, 7), tot = r + b;
        return { q: `Ek bag mein ${r} red aur ${b} blue balls hain. 1 Red ball nikalne ki probability kya hogi?`, ans: `${r}/${tot}`, opts: [`${r}/${tot}`, `${b}/${tot}`, `1/${r}`, `${r}/${b}`], sol: `\\( P(\\text{Red}) = \\frac{${r}}{${r} + ${b}} = \\frac{${r}}{${tot}} \\)` };
      }
    };

    let qCount = 0, seconds = 0, timerInterval, currentAns = "", answered = false;
    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_jee_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        updateBadge(true);
      }
      updateChapters();
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("gemini_jee_key", key);
        updateBadge(true);
      } else {
        localStorage.removeItem("gemini_jee_key");
        updateBadge(false);
      }
      resetAndGenerate();
    }

      const badge = document.getElementById("modeBadge");
      badge.innerText = isAI ? "✨ Live AI Mode" : "Built-in Mode";
      badge.style.background = isAI ? "#16a34a" : "#ea580c";
    }

    function updateChapters() {
      const cls = document.getElementById("classSelect").value;
      const chapSelect = document.getElementById("chapterSelect");
      chapSelect.innerHTML = "";
      chapters[cls].forEach(ch => {
