<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered JEE Physics Generator</title>
  <link rel="stylesheet" href="style.css">
  <script id="MathJax-script" async src="https://jsdelivr.net"></script>
  <style>
    .ai-box { background: #eff6ff; border: 1.5px solid #93c5fd; padding: 10px; border-radius: 10px; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }
    .ai-box input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
    .ai-badge { background: #2563eb; color: white; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    select { padding: 10px 12px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 14px; flex: 1; min-width: 135px; }
    .status-bar { display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px 15px; border-radius: 10px; font-weight: 600; margin-bottom: 15px; color: #0f172a; font-size: 14px; }
    #solution-box { display: none; background: #f0fdf4; border-left: 4px solid #16a34a; padding: 15px; margin-top: 15px; text-align: left; border-radius: 8px; color: #14532d; font-size: 14px; }
    .question-text { font-size: 16px; line-height: 1.65; text-align: left; margin-bottom: 15px; color: #1e293b; font-weight: 500; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-row .btn { margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JEE AI Physics</h1>
    <p style="margin-bottom: 12px; font-size: 13px;">Hybrid Engine: Built-in Bank + Live Gemini AI</p>

    <!-- Live AI Key Box -->
    <div class="ai-box">
      <span class="ai-badge" id="modeBadge">Built-in Mode</span>
      <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key for Unlimited AI Questions..." onchange="saveApiKey()">
    </div>

    <!-- Class, Unit & Difficulty Selection -->
    <div class="controls">
      <select id="classSelect" onchange="updateChapters()">
        <option value="11">Class 11 (Units 1 - 10)</option>
        <option value="12">Class 12 (Units 11 - 20)</option>
      </select>
      <select id="chapterSelect" onchange="resetAndGenerate()"></select>
      <select id="levelSelect" onchange="resetAndGenerate()">
        <option value="JEE Main">Level: JEE Main</option>
        <option value="JEE Advanced">Level: JEE Advanced</option>
      </select>
    </div>

    <div class="status-bar">
      <span id="qNumber">Q. 1</span>
      <span id="timer">Time: 00:00</span>
    </div>

    <div id="question" class="question-text">Loading question...</div>
    <div id="options"></div>
    <p id="result" style="font-weight: 700; font-size: 15px; margin-top: 12px;"></p>

    <div id="solution-box">
      <strong>Detailed Solution:</strong>
      <div id="solution-text" style="margin-top: 8px; line-height: 1.6;"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
      <a href="index.html" class="btn" style="background: #475569; box-shadow: none;">Home</a>
    </div>
  </div>

  <!-- Built-in Fallback Question Banks -->
  <script src="phy-class11.js"></script>
  <script src="phy-class12.js"></script>

  <script>
    let qCount = 0, seconds = 0, timerInterval, currentAns = "", answered = false, lastIdx = -1;

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(arr) { return arr[rand(0, arr.length - 1)]; }

    // Load saved API key if present
    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_jee_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        updateBadge(true);
      }
      updateChapters();
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("gemini_jee_key", key);
        updateBadge(true);
      } else {
        localStorage.removeItem("gemini_jee_key");
        updateBadge(false);
      }
      resetAndGenerate();
    }

    function updateBadge(isAI) {
      const badge = document.getElementById("modeBadge");
      badge.innerText = isAI ? "✨ Live AI Mode" : "Built-in Mode";
      badge.style.background = isAI ? "#16a34a" : "#2563eb";
    }

    function updateChapters() {
      const cls = document.getElementById("classSelect").value;
      const chapSelect = document.getElementById("chapterSelect");
      chapSelect.innerHTML = "";
      const list = cls === "11" ? phyClass11Chapters : phyClass12Chapters;
      list.forEach(ch => {
        let opt = document.createElement("option");
        opt.value = ch.id;
        opt.innerText = ch.name;
        chapSelect.appendChild(opt);
      });
      resetAndGenerate();
    }

    function startTimer() {
      clearInterval(timerInterval);
      seconds = 0;
      document.getElementById("timer").innerText = "Time: 00:00";
      timerInterval = setInterval(() => {
        seconds++;
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `Time: ${m}:${s}`;
      }, 1000);
    }

    function resetAndGenerate() { qCount = 0; lastIdx = -1; nextQuestion(); }

    async function nextQuestion() {
      qCount++; answered = false;
      document.getElementById("qNumber").innerText = `Q. ${qCount}`;
      document.getElementById("result").innerText = "";
      document.getElementById("solution-box").style.display = "none";
      
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const cls = document.getElementById("classSelect").value;
      const chapSelect = document.getElementById("chapterSelect");
      const unitId = chapSelect.value;
      const unitName = chapSelect.options[chapSelect.selectedIndex]?.text || "Physics";
      const level = document.getElementById("levelSelect").value;

      if (apiKey) {
        // AI GENERATION MODE
        document.getElementById("question").innerHTML = "✨ <em>AI naya JEE question bana raha hai...</em>";
        document.getElementById("options").innerHTML = "";
        document.getElementById("nextBtn").disabled = true;

        try {
          const prompt = `Generate 1 unique, high-quality ${level} Physics multiple-choice question from Class ${cls} "${unitName}". Use Hinglish or clear English. Format math equations with LaTeX \\( ... \\). Return ONLY valid JSON in this exact format: {"q": "question text", "opts": ["opt1", "opt2", "opt3", "opt4"], "ans": "exact matching string from opts", "sol": "step by step solution"}`;

          const response = await fetch(`https://googleapis.com{apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json", temperature: 0.9 }
            })
          });

          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text;
          const qData = JSON.parse(rawText);
          renderQuestion(qData);
        } catch (err) {
          console.error(err);
          // Fallback to built-in if API fails or quota ends
          loadBuiltInQuestion(cls, unitId);
        } finally {
          document.getElementById("nextBtn").disabled = false;
        }
      } else {
        // BUILT-IN OFFLINE MODE
        loadBuiltInQuestion(cls, unitId);
      }
    }

    function loadBuiltInQuestion(cls, unitId) {
      const db = cls === "11" ? phyClass11DB : phyClass12DB;
      const pool = db[unitId] || db["u1"];
      let idx = rand(0, pool.length - 1);
      if (pool.length > 1 && idx === lastIdx) idx = (idx + 1) % pool.length;
      lastIdx = idx;
      renderQuestion(pool[idx]());
    }

    function renderQuestion(qData) {
      startTimer();
      document.getElementById("question").innerHTML = qData.q;
      document.getElementById("solution-text").innerHTML = qData.sol;
      currentAns = qData.ans;

      let choices = [...new Set(qData.opts)].slice(0, 4).sort(() => Math.random() - 0.5);
      let optHTML = "";
      choices.forEach(opt => {
        const safeOpt = opt.replace(/'/g, "\\'");
        optHTML += `<button class="option" onclick="checkAns('${safeOpt}')">${opt}</button>`;
      });
      document.getElementById("options").innerHTML = optHTML;
      if (window.MathJax) MathJax.typesetPromise();
    }

    function checkAns(selected) {
      if (answered) return;
      answered = true;
      clearInterval(timerInterval);
      let res = document.getElementById("result");
      if (selected === currentAns) {
        res.style.color = "#16a34a";
        res.innerText = `Sahi Jawab! (Time: ${seconds}s)`;
      } else {
        res.style.color = "#dc2626";
        res.innerText = `Galat Jawab! Sahi uttar: ${currentAns}`;
      }
      document.getElementById("solution-box").style.display = "block";
      if (window.MathJax) MathJax.typesetPromise();
    }
  </script>
</body>
</html>
