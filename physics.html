<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Physics Generator</title>
  <link rel="stylesheet" href="style.css">
  <script id="MathJax-script" async src="https://jsdelivr.net"></script>
  <style>
    .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    select { flex: 1; min-width: 135px; padding: 10px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 14px; }
    .status-bar { display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px 14px; border-radius: 10px; font-weight: 600; margin-bottom: 15px; font-size: 14px; }
    .question-text { font-size: 16px; line-height: 1.6; text-align: left; margin-bottom: 15px; font-weight: 500; }
    #solution-box { display: none; background: #f0fdf4; border-left: 4px solid #16a34a; padding: 14px; margin-top: 15px; text-align: left; border-radius: 8px; font-size: 14px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-row .btn { margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JEE Physics</h1>
    <div class="controls">
      <select id="classSelect" onchange="updateChapters()">
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>
      <select id="chapterSelect" onchange="resetQuiz()"></select>
    </div>

    <div class="status-bar">
      <span id="qNumber">Q. 1</span>
      <span id="timer">Time: 00:00</span>
    </div>

    <div id="question" class="question-text"></div>
    <div id="options"></div>
    <p id="result" style="font-weight: 700; margin-top: 12px;"></p>

    <div id="solution-box">
      <strong>Detailed Solution:</strong>
      <div id="solution-text" style="margin-top: 6px;"></div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="nextQuestion()">Next Question →</button>
      <a href="index.html" class="btn" style="background: #475569; box-shadow: none;">Home</a>
    </div>
  </div>

  <script>
    const chapters = {
      "11": [
        { id: "kinematics", name: "1. Kinematics" },
        { id: "nlm", name: "2. Laws of Motion" },
        { id: "wep", name: "3. Work, Energy & Power" },
        { id: "gravitation", name: "4. Gravitation" }
      ],
      "12": [
        { id: "electrostatics", name: "1. Electrostatics" },
        { id: "current", name: "2. Current Electricity" },
        { id: "magnetism", name: "3. Magnetism" },
        { id: "optics", name: "4. Ray Optics" }
      ]
    };

    let qCount = 0, seconds = 0, timerInterval, currentAns = "", answered = false;
    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function updateChapters() {
      const cls = document.getElementById("classSelect").value;
      const sel = document.getElementById("chapterSelect");
      sel.innerHTML = "";
      chapters[cls].forEach(c => {
        let o = document.createElement("option");
        o.value = c.id; o.innerText = c.name; sel.appendChild(o);
      });
      resetQuiz();
    }

    function startTimer() {
      clearInterval(timerInterval); seconds = 0;
      document.getElementById("timer").innerText = "Time: 00:00";
      timerInterval = setInterval(() => {
        seconds++;
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `Time: ${m}:${s}`;
      }, 1000);
    }

    function resetQuiz() { qCount = 0; nextQuestion(); }

    function nextQuestion() {
      qCount++; answered = false;
      document.getElementById("qNumber").innerText = `Q. ${qCount}`;
      document.getElementById("result").innerText = "";
      document.getElementById("solution-box").style.display = "none";
      startTimer();

      const ch = document.getElementById("chapterSelect").value;
      const qData = makeQ(ch);
      document.getElementById("question").innerHTML = qData.q;
      document.getElementById("solution-text").innerHTML = qData.sol;
      currentAns = qData.ans;

      let html = "";
      [...qData.opts].sort(() => Math.random() - 0.5).forEach(opt => {
        html += `<button class="option" onclick="checkAns('${opt}')">${opt}</button>`;
      });
      document.getElementById("options").innerHTML = html;
      if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
    }

    function makeQ(ch) {
      if (ch === "kinematics") {
        let u = rand(2, 6) * 10, h = (u * u) / 20;
        return { q: `Ek ball ko vertically upward \\( u = ${u}\\text{ m/s} \\) se phenka gaya. Max height kya hogi? (\\( g = 10\\text{ m/s}^2 \\))`, ans: `${h} m`, opts: [`${h} m`, `${h*2} m`, `${h+15} m`, `${Math.abs(h-10)} m`], sol: `\\( H = \\frac{u^2}{2g} = \\frac{${u}^2}{20} = ${h}\\text{ m} \\)` };
      }
      if (ch === "nlm") {
        let m = rand(2, 8), a = rand(2, 5), f = rand(35, 65), fk = f - m * a;
        return { q: `Ek \\( ${m}\\text{ kg} \\) block par \\( ${f}\\text{ N} \\) force lagane par acceleration \\( ${a}\\text{ m/s}^2 \\) hai. Friction force kya hoga?`, ans: `${fk} N`, opts: [`${fk} N`, `${m*a} N`, `${f+m*a} N`, `${fk+5} N`], sol: `\\( f_k = F - ma = ${f} - (${m} \\times ${a}) = ${fk}\\text{ N} \\)` };
      }
      if (ch === "wep") {
        let m = rand(2, 6), v1 = rand(2, 4), v2 = v1 + rand(2, 5), w = 0.5 * m * (v2 * v2 - v1 * v1);
        return { q: `Ek \\( ${m}\\text{ kg} \\) body ki speed \\( ${v1}\\text{ m/s} \\) se \\( ${v2}\\text{ m/s} \\) ho jati hai. Net work done kitna hoga?`, ans: `${w} J`, opts: [`${w} J`, `${w+15} J`, `${0.5*m*v2*v2} J`, `${Math.abs(w-10)} J`], sol: `\\( W = \\frac{1}{2}m(v_2^2 - v_1^2) = ${w}\\text{ J} \\)` };
      }
      if (ch === "gravitation") {
        let n = rand(1, 3), gNew = (10 / Math.pow(1 + n, 2)).toFixed(2);
        return { q: `Earth surface se \\( h = ${n}R \\) height par \\( g' \\) ki value kya hogi? (\\( g = 10\\text{ m/s}^2 \\))`, ans: `${gNew} m/s²`, opts: [`${gNew} m/s²`, `${(10/(1+n)).toFixed(2)} m/s²`, `10.00 m/s²`, `${(gNew*2).toFixed(2)} m/s²`], sol: `\\( g' = \\frac{10}{(1 + ${n})^2} = ${gNew}\\text{ m/s}^2 \\)` };
      }
      if (ch === "electrostatics") {
        let q1 = rand(2, 6), q2 = rand(2, 5), r = rand(1, 3), f = ((9 * q1 * q2) / (r * r)).toFixed(2);
        return { q: `Do charges \\( ${q1}\\,\\mu\\text{C} \\) aur \\( ${q2}\\,\\mu\\text{C} \\) ke beech \\( ${r}\\text{ m} \\) doori hai. Force kitna hoga?`, ans: `${f} mN`, opts: [`${f} mN`, `${(f*2).toFixed(2)} mN`, `${(parseFloat(f)+4).toFixed(2)} mN`, `${(f/2).toFixed(2)} mN`], sol: `\\( F = \\frac{k q_1 q_2}{r^2} = ${f}\\text{ mN} \\)` };
      }
      if (ch === "current") {
        let r1 = rand(2, 6) * 2, v = rand(6, 18), req = r1 / 2, i = (v / req).toFixed(2);
        return { q: `Do equal resistors \\( ${r1}\\,\\Omega \\) parallel mein \\( ${v}\\text{ V} \\) battery se jude hain. Total current kitna hoga?`, ans: `${i} A`, opts: [`${i} A`, `${(v/(r1*2)).toFixed(2)} A`, `${(parseFloat(i)+1.5).toFixed(2)} A`, `${(parseFloat(i)*2).toFixed(2)} A`], sol: `\\( R_{\\text{eq}} = ${req}\\,\\Omega \\implies I = \\frac{${v}}{${req}} = ${i}\\text{ A} \\)` };
      }
      if (ch === "magnetism") {
        let q = rand(2, 5), v = rand(4, 10), b = rand(2, 6), f = q * v * b;
        return { q: `Ek \\( ${q}\\text{ C} \\) charge \\( ${v}\\text{ m/s} \\) se \\( ${b}\\text{ T} \\) magnetic field ke perpendicular enter karta hai. Force kitna lagega?`, ans: `${f} N`, opts: [`${f} N`, `0 N`, `${q*v} N`, `${f+7} N`], sol: `\\( F = qvB = ${q} \\times ${v} \\times ${b} = ${f}\\text{ N} \\)` };
      }
      if (ch === "optics") {
        let fCm = rand(2, 5) * 10, p = (100 / fCm).toFixed(2);
        return { q: `Convex lens ki focal length \\( +${fCm}\\text{ cm} \\) hai. Power (Dioptre mein) kitni hogi?`, ans: `+${p} D`, opts: [`+${p} D`, `-${p} D`, `+${(fCm/10).toFixed(2)} D`, `+${(parseFloat(p)+1.5).toFixed(2)} D`], sol: `\\( P = \\frac{100}{${fCm}} = +${p}\\text{ D} \\)` };
      }
    }

    function checkAns(selected) {
      if (answered) return;
      answered = true; clearInterval(timerInterval);
      let res = document.getElementById("result");
      if (selected === currentAns) {
        res.style.color = "#16a34a"; res.innerText = `Sahi Jawab! (Time: ${seconds}s)`;
      } else {
        res.style.color = "#dc2626"; res.innerText = `Galat! Sahi uttar: ${currentAns}`;
      }
      document.getElementById("solution-box").style.display = "block";
      if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise();
    }

    updateChapters();
  </script>
</body>
</html>
