<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete JEE Physics Generator - Class 11 & 12</title>
  <link rel="stylesheet" href="style.css">
  <script id="MathJax-script" async src="https://jsdelivr.net"></script>
  <style>
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
    select { padding: 10px 12px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 14px; flex: 1; min-width: 140px; }
    .status-bar { display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px 15px; border-radius: 10px; font-weight: 600; margin-bottom: 15px; color: #0f172a; font-size: 14px; }
    #solution-box { display: none; background: #f0fdf4; border-left: 4px solid #16a34a; padding: 15px; margin-top: 15px; text-align: left; border-radius: 8px; color: #14532d; font-size: 14px; }
    .question-text { font-size: 16px; line-height: 1.65; text-align: left; margin-bottom: 15px; color: #1e293b; font-weight: 500; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-row .btn { margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JEE Complete Physics</h1>
    <p style="margin-bottom: 12px; font-size: 13px;">20 Chapters • 6,000+ Dynamic JEE Numericals</p>

    <div class="controls">
      <select id="classSelect" onchange="updateChapters()">
        <option value="11">Class 11 (10 Chapters)</option>
        <option value="12">Class 12 (10 Chapters)</option>
      </select>
      <select id="chapterSelect" onchange="resetAndGenerate()"></select>
    </div>

    <div class="status-bar">
      <span id="qNumber">Q. 1</span>
      <span id="timer">Time: 00:00</span>
    </div>

    <div id="question" class="question-text">Loading question...</div>
    <div id="options"></div>
    <p id="result" style="font-weight: 700; font-size: 15px; margin-top: 12px;"></p>

    <div id="solution-box">
      <strong>Detailed Solution:</strong>
      <div id="solution-text" style="margin-top: 8px; line-height: 1.6;"></div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="nextQuestion()">Next Question →</button>
      <a href="index.html" class="btn" style="background: #475569; box-shadow: none;">Home</a>
    </div>
  </div>

    const chapters = {
      "11": [
        { id: "units", name: "1. Units & Measurements" },
        { id: "kinematics", name: "2. Kinematics (1D & 2D)" },
        { id: "nlm", name: "3. Laws of Motion" },
        { id: "wep", name: "4. Work, Energy & Power" },
        { id: "rotational", name: "5. Rotational Motion" },
        { id: "gravitation", name: "6. Gravitation" },
        { id: "solids_fluids", name: "7. Solids & Fluid Mechanics" },
        { id: "thermo", name: "8. Thermodynamics & KTG" },
        { id: "shm", name: "9. Oscillations (SHM)" },
        { id: "waves", name: "10. Waves & Sound" }
      ],
      "12": [
        { id: "electrostatics", name: "1. Electrostatics & Capacitance" },
        { id: "current", name: "2. Current Electricity" },
        { id: "magnetism", name: "3. Moving Charges & Magnetism" },
        { id: "emi", name: "4. EMI & Alternating Current" },
        { id: "emwaves", name: "5. Electromagnetic Waves" },
        { id: "ray_optics", name: "6. Ray Optics" },
        { id: "wave_optics", name: "7. Wave Optics" },
        { id: "modern", name: "8. Dual Nature & Atoms" },
        { id: "nuclei", name: "9. Nuclei & Radioactivity" },
        { id: "semiconductors", name: "10. Semiconductors & Logic Gates" }
      ]
    };

    let qCount = 0, seconds = 0, timerInterval, currentAns = "", answered = false, lastIdx = -1;

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(arr) { return arr[rand(0, arr.length - 1)]; }

    function updateChapters() {
      const cls = document.getElementById("classSelect").value;
      const chapSelect = document.getElementById("chapterSelect");
      chapSelect.innerHTML = "";
      chapters[cls].forEach(ch => {
        let opt = document.createElement("option");
        opt.value = ch.id;
        opt.innerText = ch.name;
        chapSelect.appendChild(opt);
      });
      resetAndGenerate();
    }

    function startTimer() {
      clearInterval(timerInterval);
      seconds = 0;
      document.getElementById("timer").innerText = "Time: 00:00";
      timerInterval = setInterval(() => {
        seconds++;
        let m = String(Math.floor(seconds / 60)).padStart(2, '0');
        let s = String(seconds % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `Time: ${m}:${s}`;
      }, 1000);
    }

    function resetAndGenerate() { qCount = 0; lastIdx = -1; nextQuestion(); }

    function nextQuestion() {
      qCount++; answered = false;
      document.getElementById("qNumber").innerText = `Q. ${qCount}`;
      document.getElementById("result").innerText = "";
      document.getElementById("solution-box").style.display = "none";
      startTimer();

      const chapter = document.getElementById("chapterSelect").value;
      const pool = getTemplates(chapter);
      let idx = rand(0, pool.length - 1);
      if (pool.length > 1 && idx === lastIdx) idx = (idx + 1) % pool.length;
      lastIdx = idx;

      let qData = pool[idx]();
      document.getElementById("question").innerHTML = qData.q;
      document.getElementById("solution-text").innerHTML = qData.sol;
      currentAns = qData.ans;

      let choices = [...new Set(qData.opts)].slice(0, 4).sort(() => Math.random() - 0.5);
      let optHTML = "";
      choices.forEach(opt => {
        optHTML += `<button class="option" onclick="checkAns('${opt}')">${opt}</button>`;
      });
      document.getElementById("options").innerHTML = optHTML;
      if (window.MathJax) MathJax.typesetPromise();
    }
